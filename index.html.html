<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Office</title>
<style>
:root{
  --navy:#13294B; --navy2:#1C3A66; --ink:#17202E; --ink2:#4A5568; --mute:#7A8597; --line:#E2E7EF; --bg:#F3F5F9; --card:#FFFFFF;
  --acc:#C8892B; --accbg:#FBF3E6; --blue:#2B5FB8; --bluebg:#EAF1FC; --red:#B42318; --redbg:#FDECEA; --amber:#9A6200; --amberbg:#FFF4DB; --green:#1E7A4C; --greenbg:#E6F5EC;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:var(--navy);color:#C9D3E3;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand .mk{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#E4B565);display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:15px;letter-spacing:.5px}
.brand b{display:block;color:#fff;font-size:15.5px;letter-spacing:.2px}
.brand small{color:#8FA1BD;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:#C9D3E3;font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.08)}
#firmb span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8FA1BD}
#firmb b{display:block;color:#fff;font-size:15px;margin-top:2px}
#firmb small{display:block;color:#8FA1BD;font-size:11.5px;line-height:1.3}
.offline{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;color:#8FA1BD}
.offline i{width:7px;height:7px;border-radius:50%;background:#3DBE7B;display:inline-block}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.1px}
.top .sp{flex:1}
.top #today{color:var(--mute);font-size:13px}
#view{flex:1;overflow:auto;padding:22px 26px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
.card.flush{padding:0;overflow:auto}
.card.narrow{max-width:760px}
.chead{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.chead h3,.card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.ct{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);font-weight:650}
.ct .muted{text-transform:none;letter-spacing:0;font-weight:400}
.mt{margin-top:18px}
.muted{color:var(--mute)} .small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13.5px;font-weight:550;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#C5CEDC;background:#FAFBFD}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#F2C4BF}
.btn.danger:hover{background:var(--redbg)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn .ic{width:16px;height:16px}
.link{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:0}
.x{border:0;background:none;color:var(--mute);font-size:19px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--redbg);color:var(--red)}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{margin:0 0 2px;font-size:22px;font-weight:650}
.hello p{margin:0;color:var(--mute)}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--navy)}
.stat:nth-child(2){border-top-color:var(--acc)} .stat:nth-child(3){border-top-color:var(--blue)} .stat:nth-child(4){border-top-color:var(--green)}
.stat span{display:block;color:var(--ink2);font-size:12.5px}
.stat b{display:block;font-size:22px;font-weight:650;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid2.wideleft{grid-template-columns:1.45fr 1fr}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFBFD}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.card:not(.flush) .tbl th,.card:not(.flush) .tbl td{padding-left:4px;padding-right:4px}
.card:not(.flush) .tbl th{background:none}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#F7F9FC}
b.click{cursor:pointer;color:var(--navy)} b.click:hover{text-decoration:underline}
.r{text-align:right} .nw{white-space:nowrap} .wide{min-width:260px}
.tbl .ell{max-width:250px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.red{background:var(--redbg);color:var(--red)} .chip.amber{background:var(--amberbg);color:var(--amber)} .chip.blue{background:var(--bluebg);color:var(--blue)}
.tag{font-size:11px;font-weight:650;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px}
.tag.t1{background:var(--bluebg);color:var(--blue)} .tag.t2{background:var(--accbg);color:var(--amber)}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:#EEF1F5;color:var(--ink2);white-space:nowrap}
.st-Running{background:var(--bluebg);color:var(--blue)} .st-Completed,.st-UnderWarranty{background:var(--amberbg);color:var(--amber)} .st-Closed{background:#EEF1F5;color:var(--mute)}
.empty{color:var(--mute);padding:14px 2px;font-size:13.5px}
.empty.big{padding:40px 24px;text-align:center;max-width:620px;margin:0 auto}
.start ol{margin:8px 0 0;padding-left:20px;color:var(--ink2)} .start li{margin:4px 0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .sp{flex:1}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;width:260px;background:#fff}
.tabs{display:flex;gap:2px;background:#E8ECF2;padding:3px;border-radius:9px}
.tabs button{border:0;background:none;font:inherit;font-size:13.5px;padding:6px 13px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:550}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.tabs small{color:var(--mute);font-weight:400;margin-left:3px}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px 12px}
.fgrid>*{grid-column:span 2;min-width:0}
.fgrid>.two{grid-column:span 4} .fgrid>.full,.fgrid>h4{grid-column:1/-1} .fgrid>.half{grid-column:span 3}
.fgrid h4{margin:8px 0 -2px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:5px}
.fgrid>h4:first-child{margin-top:0}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-size:12px;color:var(--ink2);font-weight:550;display:flex;align-items:center;gap:6px}
.f input,.f select,.f textarea,.items input,.items textarea,select.mini{border:1px solid #D5DCE6;border-radius:7px;padding:7px 9px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink);width:100%}
.f textarea,.items textarea{resize:vertical;line-height:1.45}
.f textarea.mono{font-size:13.5px}
.f input[type=color]{padding:2px;height:35px}
.f input:focus,.f select:focus,.f textarea:focus,.items input:focus,.items textarea:focus,.search:focus{outline:2px solid #BFD3F5;border-color:#7FA3E0}
.f.hint,.hint{font-size:12px;color:var(--mute)}
.hint code{background:#EEF1F5;padding:0 4px;border-radius:4px;font-size:11.5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);padding-top:18px}
.chk.full{padding-top:2px}
.stack{display:flex;flex-direction:column;gap:11px}
.reset{border:0;background:none;color:var(--mute);font-size:11px;cursor:pointer;padding:0 4px;border-radius:4px;visibility:hidden}
.reset.on{visibility:visible;color:var(--blue)} .reset:hover{background:var(--bluebg)}
select.mini{padding:3px 6px;font-size:12.5px;width:auto;font-weight:600}
/* editor split */
.split{display:grid;grid-template-columns:minmax(440px,1fr) minmax(420px,1.05fr);gap:18px;align-items:start}
.pane.prev{position:sticky;top:0}
.pbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pbar .sp{flex:1}
.pwrap{background:#D9DEE6;border-radius:var(--r);padding:16px;max-height:calc(100vh - 150px);overflow:auto;border:1px solid #CBD2DD}
.pscale{width:210mm;margin:0 auto}
.docpage{background:#fff;width:210mm;min-height:297mm;box-shadow:0 4px 18px rgba(16,24,40,.18);display:flex;flex-direction:column}
.docpage .docbody{flex:1}
.docpage p{word-wrap:break-word}
.items{width:100%;border-collapse:collapse;margin-bottom:10px}
.items th{font-size:11.5px;color:var(--mute);text-align:left;font-weight:600;padding:0 4px 4px}
.items td{padding:3px 3px;vertical-align:top}
.items td:nth-child(1){width:42%} .items td:nth-child(2){width:14%} .items td:nth-child(3){width:8%} .items td:nth-child(4){width:10%} .items td:nth-child(5){width:21%}
.items input,.items textarea{padding:6px 6px;font-size:13px}
.tots{display:flex;gap:18px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);flex-wrap:wrap}
.tots b{color:var(--ink);font-variant-numeric:tabular-nums}
.tots .g b{font-size:15px;color:var(--navy)}
/* settings */
.slot{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.sl-h b{font-size:13.5px} .sl-h small{display:block;color:var(--mute);font-size:12px}
.sl-i{width:100%;height:74px;border:1px dashed #CBD2DD;border-radius:8px;display:grid;place-items:center;background:repeating-conic-gradient(#F4F6F9 0% 25%,#fff 0% 50%) 50%/16px 16px;overflow:hidden}
.sl-i img{max-height:66px;max-width:94%;object-fit:contain}
.meter{height:8px;border-radius:99px;background:#EEF1F5;overflow:hidden;margin:6px 0 10px}
.meter i{display:block;height:100%;background:var(--navy)}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:12px;width:min(880px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:92vh}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px}
.mbody{padding:16px 20px;overflow:auto}
.mbody>.btn.danger{margin-top:16px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:#FAFBFD;border-radius:0 0 12px 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)} #toast.err{background:var(--red)}
.dchip{border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.dchip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dchip.ok{color:var(--green);background:var(--greenbg);border-color:#BFE3CF} .dchip.warn{color:var(--amber);background:var(--amberbg);border-color:#F1D9A6} .dchip.off{color:var(--mute)}
.chip.green{background:var(--greenbg);color:var(--green)}
.steps{padding-left:20px;color:var(--ink2);margin:14px 0} .steps li{margin:5px 0}
code{background:#EEF1F5;padding:0 4px;border-radius:4px;font-size:12px}
.tree{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.6 Consolas,"Courier New",monospace;color:var(--ink2);white-space:pre;overflow:auto;margin:0 0 10px}

/* works & look-up */
.gsearch{position:relative;flex:0 1 420px;margin-left:18px}
.gsearch input{width:100%;border:1px solid var(--line);background:#F6F8FB;border-radius:9px;padding:8px 12px;font:inherit;font-size:13.5px}
.gsearch input:focus{background:#fff;outline:2px solid #BFD3F5;border-color:#7FA3E0}
#sres{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.16);max-height:70vh;overflow:auto;z-index:40;padding:6px}
#sres.open{display:block}
.sg h5{margin:8px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.sr{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer;font:inherit}
.sr:hover{background:#F3F6FB} .sr b{display:block;font-size:13.5px;font-weight:600} .sr small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbrand,.mset{display:none}
.dchip.plain{color:var(--ink2)}
.dchip.plain::before{display:none}
.tabs.sm button{font-size:12.5px;padding:4px 10px}
.tabs.scroll{overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs.scroll::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, box-shadow .15s}
.wcard:hover{border-color:#B9C6DA;box-shadow:0 4px 14px rgba(16,24,40,.08)}
.wcard h3{margin:2px 0 0;font-size:15px;line-height:1.3}
.wcard p{margin:0;font-size:12.5px}
.wc-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wc-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.wc-nums small{display:block;font-size:11px;color:var(--mute)} .wc-nums b{font-size:13.5px;font-variant-numeric:tabular-nums}
.wc-next{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);background:#F7F9FC;border-radius:7px;padding:5px 8px;margin-top:4px}
.ftag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;background:#EEF1F5;color:var(--ink2)}
.wc-top .ftag,.whead .ftag{margin-left:0}
.f-eq{background:#E6EEFB;color:#1F3864} .f-rr{background:#F8E9E7;color:#7A1F1F} .f-rc{background:#E4F2EA;color:#1E4D3A}
.stt{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stt.blue{background:var(--bluebg);color:var(--blue)} .stt.amber{background:var(--amberbg);color:var(--amber)} .stt.red{background:var(--redbg);color:var(--red)} .stt.gray{background:#EEF1F5;color:var(--mute)} .stt.violet{background:#F0EBFB;color:#5B3FA8}
.whead{margin-bottom:14px}
.whead h2{margin:6px 0 2px;font-size:21px}
.whead p{margin:0;max-width:900px}
.wh-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.back{margin-bottom:6px;font-size:13px}
.stats.s5{grid-template-columns:repeat(5,1fr)}
button.stat{text-align:left;font:inherit;color:inherit;cursor:pointer}
button.stat:hover{border-color:#B9C6DA}
.tabs.wt{margin-bottom:14px;display:inline-flex;max-width:100%;overflow-x:auto}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:7px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--mute)} .kv dd{margin:0;word-break:break-word}
.chead.pad{padding:12px 16px 0}
.tscroll{overflow-x:auto}
.tbl tr.dim td{opacity:.55} .tbl tr.dim2 td{color:var(--mute)}
.wl{color:var(--navy);font-weight:600;cursor:pointer;text-decoration:none} .wl:hover{text-decoration:underline}
.pay{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.pay.on{color:var(--green);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff} .fchip small{opacity:.7;margin-left:3px}
.fext{display:inline-grid;place-items:center;width:34px;height:22px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;background:#EEF1F5;color:var(--ink2)}
.e-pdf{background:#FDECEA;color:#B42318} .e-doc{background:#E6EEFB;color:#1F4FA8} .e-xls{background:#E4F2EA;color:#1E7A4C} .e-img{background:#F0EBFB;color:#5B3FA8}
.flags{margin:0;padding-left:18px} .flags li{margin:6px 0}
textarea.full{width:100%;border:1px solid #D5DCE6;border-radius:7px;padding:8px;font:inherit}
.flist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.flist .chk{padding-top:4px;font-size:12.5px}
.redt{color:var(--red)} .mt8{margin-top:8px}
.bnav{display:none}
@media (max-width:1180px){.stats.s5{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  body{font-size:14.5px}
  #app{grid-template-columns:1fr;height:auto;min-height:100vh}
  main{height:auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:30;padding:10px 12px;gap:8px;flex-wrap:wrap}
  .mbrand{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--navy);color:#E4B565;font-weight:800;font-size:13px}
  .top h1{font-size:17px}
  .mset{display:block;border:0;background:none;font-size:20px;color:var(--ink2);padding:2px 6px}
  #today,#drivechip{display:none}
  .gsearch{order:5;flex:1 1 100%;margin:4px 0 0}
  #view{padding:12px 12px 90px;overflow:visible}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:35;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0}

      if (depth > 8 || files.length > 40000) return;
      for await (var ent of dh.entries()) {
        var name = ent[0], hd = ent[1];
        if (name.charAt(0) === '.' || name === '_BACKUPS' || /^~\$|^desktop\.ini$|^thumbs\.db$/i.test(name)) continue;
        var p = path ? path + '/' + name : name;
        if (hd.kind === 'directory') { dirs.push({ path: p }); await walk(hd, p, depth + 1); }
        else { files.push({ path: p, name: name }); FH[p] = hd; }
        if (++n % 300 === 0) onProg(n);
      }
    }
    await walk(root, '', 0);
    return { dirs: dirs, files: files, at: new Date().toISOString() };
  }

  }

        '<section class="card flush"><div class="tscroll"><table class="tbl"><thead><tr><th>Work</th><th>Type</th><th class="r">BG / PG (Rs.)</th><th>BG valid</th><th class="r">SD (Rs.)</th><th>SD due back</th><th>Remarks</th></tr></thead><tbody>' +
        bg.map(function (b) {
          return '<tr><td class="wide">' + wlink(b.workId, b.workId ? null : b.loaNo) + '<div class="muted small">' + h(b.loaNo) + '</div></td><td>' + h(b.type) + (b.bgNo ? '<div class="muted small">' + h(b.bgNo) + '</div>' : '') + '</td><td class="r nw">' + money(b.bgAmount) + (b.bgReleased ? '<div class="muted small">' + h(b.bgReleased) + '</div>' : '') + '</td>' +
            '<td class="nw">' + dt(b.bgValidity) + '</td><td class="r nw">' + money(b.sdAmount) + '</td><td class="nw">' + dt(b.sdDue) + (b.sdDue && !/^yes|released/i.test(b.sdReleased) ? '<div>' + chip(M.daysTo(b.sdDue)) + '</div>' : '') + '</td><td><div class="ell2 small">' + h(b.remarks || b.sdCondition) + '</div></td></tr>';
        }).join('') + '</tbody></table></div></section>';
      bindLookupBar(); bindWl(V); return;
    }
    if (lTab === 'agreements') {
      var ag = L.works.filter(function (w) { return (lFilter !== 'agr' || w.agreementNo) && hit([w.title, w.loaNo, w.agreementNo, w.tenderNo, w.authority]); });
      V.innerHTML = lookupBar(filt([['all', 'All works'], ['agr', 'With agreement']])) + '<section class="card flush"><div class="tscroll"><table class="tbl"><thead><tr><th>Work</th><th>LOA No. & date</th><th>Agreement</th><th class="r">Value (Rs.)</th><th>Completion</th></tr></thead><tbody>' +
        ag.map(function (w) { return '<tr><td class="wide">' + wlink(w.id) + firmTag(w.firm) + '</td><td><div class="small">' + h(w.loaNo) + '</div><div class="muted small">' + dt(w.loaDate) + '</div></td><td class="small">' + h(w.agreementNo || '') + (w.agreementDate ? '<div class="muted">' + dt(w.agreementDate) + '</div>' : '') + '</td><td class="r nw">' + money(w.value) + '</td><td class="nw">' + dt(w.done || w.extUpto || w.schedEnd) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
      bindLookupBar(); bindWl(V); return;
    }
    if (lTab === 'tenders') {
      var tn = L.tenders.filter(function (t) { if (lFilter === 'won' && !/award/i.test(t.status)) return false; if (lFilter === 'lost' && !/not awarded/i.test(t.status)) return false; return hit([t.tenderNo, t.name, t.authority, t.result, t.status]); });
      V.innerHTML = lookupBar(filt([['all', 'All'], ['won', 'Awarded'], ['lost', 'Not awarded']])) + '<section class="card flush"><div class="tscroll"><table class="tbl"><thead><tr><th>Tender</th><th>Authority</th><th class="r">Estimate</th><th class="r">Our quote</th><th>Result</th><th>Status</th></tr></thead><tbody>' +
        tn.map(function (t) { var below = t.estimate && t.quoted ? Math.round((1 - t.quoted / t.estimate) * 1000) / 10 : null; return '<tr><td class="wide"><b>' + h(t.name) + '</b>' + firmTag(t.firm) + '<div class="muted small">' + h(t.tenderNo) + ' · ' + dt(t.due) + '</div>' + (t.workId ? '<div>' + wlink(t.workId, 'Open work ›') + '</div>' : '') + '</td><td class="small">' + h(t.authority) + '</td><td class="r nw">' + money(t.estimate) + '</td><td class="r nw">' + money(t.quoted) + (below != null ? '<div class="muted small">' + (below >= 0 ? below + '% below' : (-below) + '% above') + '</div>' : '') + '</td><td class="small">' + h(t.result) + '</td><td>' + statusTag(t.status) + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
      bindLookupBar(); bindWl(V); return;
    }
    if (lTab === 'files') {
      var fl = L.files.filter(function (f) { if (lFilter === 'works' && !f.workId) return false; return !lq || (f.path).toLowerCase().indexOf(lq.toLowerCase()) >= 0; });
      V.innerHTML = lookupBar(filt([['all', 'All files'], ['works', 'Work folders only']])) + filesBlock(fl, null);
      bindLookupBar(); bindFiles(V, null); return;
    }
  }

  /* ---- global search ---- */
  function runSearch(q) {
    var box = $('#sres'); q = q.trim().toLowerCase();
    if (q.length < 2) { box.className = ''; box.innerHTML = ''; return; }
    function m(arr) { return arr.join(' ').toLowerCase().indexOf(q) >= 0; }
    var g = [
      ['Works', L.works.filter(function (w) { return m([w.title, w.name, w.loaNo, w.tenderNo, w.agreementNo, w.authority]); }).slice(0, 6).map(function (w) { return { t: w.title, s: (firm(w.firm).short || '') + ' · ' + (w.loaNo || w.authority || ''), go: ['work', { id: w.id }] }; })],
      ['Bills', L.invoices.filter(function (i) { return m([i.no, i.desc, i.billTo]); }).slice(0, 6).map(function (i) { return { t: i.no + ' · Rs. ' + M.inr(i.total || 0, 0), s: (i.workId ? W(i.workId).title : i.desc || '') + ' · ' + dt(i.date), go: i.workId ? ['work', { id: i.workId, tab: 'bills' }] : ['lookup', { tab: 'bills' }] }; })],
      ['BG & SD', L.bgsd.filter(function (b) { return m([b.bgNo, b.loaNo, b.type, b.bank]); }).slice(0, 4).map(function (b) { return { t: (b.type || 'BG/SD') + (b.bgNo ? ' · ' + b.bgNo : ''), s: b.workId ? W(b.workId).title : b.loaNo, go: b.workId ? ['work', { id: b.workId, tab: 'bgsd' }] : ['lookup', { tab: 'bgsd' }] }; })],
      ['Tenders', L.tenders.filter(function (t) { return m([t.tenderNo, t.name, t.authority]); }).slice(0, 4).map(function (t) { return { t: t.name, s: t.tenderNo + ' · ' + t.status, go: t.workId ? ['work', { id: t.workId }] : ['lookup', { tab: 'tenders' }] }; })],
      ['Letters', S.letters.filter(function (l) { return m([l.no, l.subject]); }).slice(0, 4).map(function (l) { return { t: l.no, s: l.subject, go: ['letter', { load: l.id }] }; })],
      ['Files', L.files.filter(function (f) { return f.path.toLowerCase().indexOf(q) >= 0; }).slice(0, 8).map(function (f) { return { t: f.name, s: f.path.split('/').slice(0, -1).join(' › '), file: f.path }; })]
    ].filter(function (x) { return x[1].length; });
    box.innerHTML = g.length ? g.map(function (x, gi) { return '<div class="sg"><h5>' + x[0] + '</h5>' + x[1].map(function (r, ri) { return '<button class="sr" data-g="' + gi + '" data-r="' + ri + '"><b>' + h(r.t) + '</b><small>' + h(r.s || '') + '</small></button>'; }).join('') + '</div>'; }).join('') : '<div class="empty">Nothing found for “' + h(q) + '”.</div>';
    box.className = 'open';
    $$('.sr', box).forEach(function (b) {
      b.onclick = function () { var r = g[+b.dataset.g][1][+b.dataset.r]; box.className = ''; $('#gq').value = ''; if (r.file) openFile(r.file); else go(r.go[0], r.go[1]); };
    });
  }

  /* ---------------- shell ---------------- */
  function fitPreview() {
    $$('.pwrap').forEach(function (w) {
      var s = $('.pscale', w); if (!s) return;
      var z = Math.min(1.1, (w.clientWidth - 32) / (210 * 3.7795));
      s.style.zoom = z > 0.2 ? z : 0.5;
    });
  }
  function renderFirmBadge() { var f = firm(S.settings.activeFirm); $('#firmb').innerHTML = '<span>Default firm</span><b>' + h(f.short || '') + '</b><small>' + h(f.name || '') + '</small>'; }
  window.addEventListener('resize', fitPreview);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#modal').className) closeModal(); });
  window.addEventListener('DOMContentLoaded', function () {
    load();
    $$('.nav button').forEach(function (b) { b.innerHTML = icon(b.dataset.icon) + '<span>' + b.textContent + '</span>'; b.onclick = function () { go(b.dataset.go, b.dataset.go === 'letter' || b.dataset.go === 'invoice' ? null : undefined); }; });
    renderFirmBadge();
    relink();
    var gq = $('#gq'), st_;
    if (gq) { gq.oninput = function () { clearTimeout(st_); st_ = setTimeout(function () { runSearch(gq.value); }, 120); }; gq.onfocus = function () { if (gq.value) runSearch(gq.value); }; }
    document.addEventListener('click', function (e) { var b = $('#sres'); if (b && !e.target.closest('#sres') && e.target !== gq) b.className = ''; });
    $$('.bnav button').forEach(function (b) { b.onclick = function () { go(b.dataset.go); }; });
    initDrive();
    $('#today').textContent = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    go('home');
  });
  window.TOApp = { go: go, state: function () { return S; }, _useDir: async function (hd, sync) { DIR = hd; DIRNAME = hd.name || 'Engiquest'; DIRSTATE = 'granted'; renderDriveChip(); if (sync) await syncFromDir(); else await flushDir(); await syncDrive(true); } };
})();
</script>
</body>
</html>
